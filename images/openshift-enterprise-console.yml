container_yaml:
  remote_source:
    repo: git@github.com:openshift-priv/console.git
    ref: release-{MAJOR}.{MINOR}
    pkg_managers:
      - yarn
    packages:
      yarn:
        - path: backend
content:
  source:
    dockerfile: Dockerfile.product
    git:
      branch:
        target: 20211012-console-cachito
      url: git@github.com:sosiouxme/console.git
    ci_alignment:
      streams_prs:
        ci_build_root:
          stream: rhel-8-golang-ci-build-root
    # have cachito read vendored source, not supply it
    pkg_managers:
      - gomod
enabled_repos:
- rhel-8-baseos-rpms
- rhel-8-appstream-rpms
for_payload: true
from:
  builder:
  - stream: golang
  - member: openshift-base-nodejs
  member: openshift-enterprise-base
labels:
  License: GPLv2+
  io.k8s.description: This is a component of OpenShift Container Platform and provides
    a web console.
  io.k8s.display-name: OpenShift Console
  io.openshift.tags: openshift,console
  vendor: Red Hat
name: openshift/ose-console
owners:
- spadgett@redhat.com
